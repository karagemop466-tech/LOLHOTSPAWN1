name: Refresh LoL Pick'ems & External Markets

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - arena/8336fb7e-lolhotspawn1
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-picks.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Leaguepedia Data schedule & roster harvest
        run: python3 scripts/leaguepedia_data.py

      - name: Commit refreshed live data snapshot to session branch
        if: github.ref_name == 'arena/8336fb7e-lolhotspawn1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin arena/8336fb7e-lolhotspawn1
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): harvest untruncated Leaguepedia Data match schedules [skip ci]"
            git push origin arena/8336fb7e-lolhotspawn1
          fi
