name: Refresh LoL Pick'ems & External Markets

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-lol-pickems-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh live sources, originate probabilities, rebuild HTML & validate
        run: python3 scripts/refresh.py --fetch-live

      - name: Run full invariant & link test suite
        run: pytest -v

      - name: Commit refreshed picks and static HTML pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add data/ *.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore(picks): automated 4h refresh of Hotspawn LoL lines & probabilities"
            git push origin "${GITHUB_REF_NAME}"
          fi
