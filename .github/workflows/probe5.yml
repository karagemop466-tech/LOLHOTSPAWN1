name: probe-sources-5
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe5.yml"
      - "tools/probe5.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/probe5.py
      - name: Commit evidence
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add evidence/probe5
          git commit -m "chore(evidence): probe5 cargo syntax [skip ci]" || echo "nothing to commit"
          git push
