name: probe
on:
  push:
    branches: ["arena/2b1b75f6-lolhotspawn1"]
    paths: [".github/workflows/probe.yml", "tools/probe.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe hotspawn
        run: bash tools/probe.sh
