name: probe
on:
  push:
    branches: ["arena/2b1b75f6-lolhotspawn1"]
    paths: [".github/workflows/probe.yml", "tools/probe.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe hotspawn
        run: python3 tools/probe6.py > probe-report6.txt 2>&1 || true
      - name: Publish diagnostics back to the branch
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f probe-report6.txt
          git commit -m "chore(probe): diagnostics report [skip ci]"
          git push origin HEAD:arena/2b1b75f6-lolhotspawn1
