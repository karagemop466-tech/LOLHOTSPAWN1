name: refresh-picks

# Single publisher for this repository.
#
#  1. pulls the full Hotspawn LoL fixture list (public fixtures API, 264 cards)
#  2. pulls external betting lines (Pinnacle guest API, Polymarket cross-check)
#  3. fits the Elo model on Leaguepedia series results and originates a line for
#     every match that has no bookmaker price
#  4. rebuilds the 11 static pages, runs the publish gate, and commits data + site
#
# Only `tools/` writes the published pages. A failing gate aborts the commit, so a
# broken build can never reach GitHub Pages.

on:
  schedule:
    # every 6 hours, inside the requested 4-8 h window, off the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Run pipeline (captured log)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          mkdir -p data
          {
            echo "=== build $(date -u +%FT%TZ) ==="
            python3 tools/collect.py   2>&1
            python3 tools/model.py     2>&1
            python3 tools/report.py    2>&1
            python3 tools/flags.py     2>&1
            python3 tools/site.py      2>&1
            python3 tools/corroborate.py 2>&1
            python3 tools/verify.py    2>&1
            python3 tools/site.py      2>&1
            python3 tools/corroborate.py 2>&1
            python3 tools/verify.py    2>&1
          } | tee data/build.log
          echo "pipeline exit: ${PIPESTATUS[0]}"

      - name: Stop on failed gate
        run: |
          tail -3 data/build.log
          test "$(grep -c '^PASS' data/build.log)" -ge 14

      - name: Commit data and site
        run: |
          set -e
          git config user.name  "arena-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json data/*.csv data/build.log data/raw assets *.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh fixtures, lines and site"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
