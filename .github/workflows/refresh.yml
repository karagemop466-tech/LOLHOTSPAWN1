name: refresh-picks

# Single publisher for this repository.
#
#  1. pulls the full Hotspawn LoL fixture list (public fixtures API)
#  2. pulls external betting lines (Pinnacle series moneylines only - the "(Kills)"
#     derivatives are filtered out - plus Kalshi, Bovada and Polymarket)
#  3. fits the Elo model on Leaguepedia series results and originates a line for
#     every match that has no bookmaker price
#  4. rebuilds the 12 static pages, runs the publish gate, and commits data + site
#
# Only `tools/` writes the published pages. A failing gate aborts the commit, so a
# broken build can never reach GitHub Pages.

on:
  schedule:
    # every 6 hours, inside the requested 4-8 h window, off the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - "tests/**"
      - "data/aliases.json"
      - "data/flags_manual.json"
      - "data/receipts/external_odds/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Run pipeline (captured log)
        # Each stage is captured, not fatal on its own: a crash in one stage must still leave a
        # complete log behind so the failure is diagnosable from the repository. The gate step
        # below is what decides pass/fail. (Before 2026-10-24 a failing gate aborted the shell
        # before the log was committed, so three consecutive scheduled runs failed with no
        # visible reason in the repo.)
        run: |
          set -uo pipefail
          mkdir -p data
          rm -f data/build_failed_steps.txt
          : > data/build.log
          echo "=== build $(date -u +%FT%TZ) sha=${GITHUB_SHA} ===" | tee -a data/build.log
          if python3 -m unittest discover -s tests -v >> data/build.log 2>&1; then
            echo "OK   unit tests" | tee -a data/build.log
          else
            echo "FAIL unit tests" | tee -a data/build.log
            echo "unit-tests" >> data/build_failed_steps.txt
          fi
          for stage in collect model report flags site corroborate verify; do
            echo "--- tools/${stage}.py ---" | tee -a data/build.log
            if python3 "tools/${stage}.py" >> data/build.log 2>&1; then
              echo "OK   tools/${stage}.py" | tee -a data/build.log
            else
              rc=$?
              echo "FAIL tools/${stage}.py (exit ${rc})" | tee -a data/build.log
              echo "${stage}" >> data/build_failed_steps.txt
            fi
          done
          echo "pipeline finished at $(date -u +%FT%TZ)" | tee -a data/build.log

      - name: Stop on failed gate
        run: |
          tail -3 data/build.log
          python3 - <<'PY'
          import json, os, sys
          failed_steps = []
          if os.path.exists("data/build_failed_steps.txt"):
              failed_steps = [s.strip() for s in open("data/build_failed_steps.txt") if s.strip()]
          report = json.load(open("data/verification.json"))
          failed = [c for c in report["checks"] if not c["ok"]]
          print(f"gate: {len(report['checks']) - len(failed)}/{len(report['checks'])} checks pass")
          if failed_steps:
              print("FAILED STAGES:", failed_steps)
              sys.exit(1)
          if not report["passed"] or failed:
              print("FAILED:", [c["name"] for c in failed])
              sys.exit(1)
          if len(report["checks"]) < 20:
              print("FAILED: expected at least 20 publish gates, found", len(report["checks"]))
              sys.exit(1)
          PY

      - name: Keep the failing log in the repository
        # A failed build still has to be inspectable by the next session, otherwise the same
        # failure repeats unseen. This log is diagnostic only and never published to the site.
        if: failure()
        run: |
          git config user.name  "arena-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/build.log data/build_failure.log || true
          git add -f data/build_failure.log data/build_failed_steps.txt || true
          git diff --cached --quiet || git commit -q -m "chore(diag): record failing build log [skip ci]"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git rebase --autostash "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            sleep 5
          done
          true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-picks-${{ github.run_id }}
          path: |
            data/build.log
            data/verification.json
            data/sources_status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit data and site
        run: |
          set -e
          git config user.name  "arena-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json data/*.csv data/build.log data/raw data/receipts assets *.html
          # A green run clears the previous failure markers, so a stale "unit-tests" line can
          # never survive a successful build and mislead the next session (2026-10-25).
          git add -A -- data/build_failure.log data/build_failed_steps.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(data): refresh fixtures, lines and site"
          # main moves under this job whenever another session merges while the six-hourly
          # collection is running. A plain push (or a rebase that stops on a conflict in the
          # generated files) fails the job and silently skips a refresh; two runs on
          # 2026-10-23 failed exactly that way. Retry, and on conflict prefer this run's
          # freshly generated files, which are the newest data in the race.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            # NOTE: inside a rebase the meaning of -X ours/theirs is inverted - "ours" is the
            # upstream we are replaying onto, "theirs" is this run's commit. We want this run's
            # freshly generated files to win, so the rebase must use `-X theirs`. (In the merge
            # fallback below the normal meaning applies, so that one stays `-X ours`.)
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              if ! git merge -X ours -m "merge origin/${GITHUB_REF_NAME} after push race" "origin/${GITHUB_REF_NAME}"; then
                git merge --abort || true
                git reset --soft "origin/${GITHUB_REF_NAME}"
                git add -A
                git commit -q -m "chore(data): refresh fixtures, lines and site" || true
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "could not publish after 5 attempts"
          exit 1
