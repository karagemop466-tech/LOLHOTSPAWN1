name: refresh-picks

# Single publisher for this repository.
#
#  1. pulls the full Hotspawn LoL fixture list (public fixtures API, 264 cards)
#  2. pulls external betting lines (Pinnacle guest API, Polymarket cross-check)
#  3. fits the Elo model on Leaguepedia series results and originates a line for
#     every match that has no bookmaker price
#  4. rebuilds the 11 static pages, runs the publish gate, and commits data + site
#
# Only `tools/` writes the published pages. A failing gate aborts the commit, so a
# broken build can never reach GitHub Pages.

on:
  schedule:
    # every 6 hours, inside the requested 4-8 h window, off the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Run pipeline (captured log)
        run: |
          set -o pipefail
          mkdir -p data
          {
            echo "=== build $(date -u +%FT%TZ) ==="
            python3 tools/collect.py   2>&1
            python3 tools/model.py     2>&1
            python3 tools/report.py    2>&1
            python3 tools/flags.py     2>&1
            python3 tools/verify.py    2>&1   # gate the data before publishing
            python3 tools/site.py      2>&1   # render with the fresh check count
            python3 tools/verify.py    2>&1   # gate the rendered pages
          } 2>&1 | tee data/build.log
          PIPE=${PIPESTATUS[0]}
          echo "pipeline exit: $PIPE"
          test "$PIPE" -eq 0

      - name: Stop on failed gate
        run: |
          tail -5 data/build.log
          python3 -c "import json,sys; v=json.load(open('data/verification.json')); bad=[c['name'] for c in v['checks'] if not c['ok']]; print(f'gate {len(v["checks"])-len(bad)}/{len(v["checks"])} checks pass'); print('FAILED:', bad) if bad else None; sys.exit(1 if bad else 0)"

      - name: Commit data and site
        run: |
          set -e
          git config user.name  "arena-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh fixtures, lines and site"
            git push
          fi
