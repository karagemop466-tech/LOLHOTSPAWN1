name: refresh-picks

on:
  schedule:
    # every 6 hours (within the requested 4-8h window), off the hour to avoid the cron rush
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect sources
        run: python3 tools/collect.py
      - name: Build probabilities and picks
        run: python3 tools/model.py
      - name: Derive flagged items
        run: python3 tools/flags.py
      - name: Build the GitHub Pages site
        run: python3 tools/site.py
      - name: Verify the dataset and the site
        run: python3 tools/verify.py
      - name: Commit refreshed data and site
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh picks and rebuild site [skip ci]"
            git push
          fi
