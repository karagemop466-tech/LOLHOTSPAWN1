name: probe-line-sources

# Manual/diagnostic probe only. It never publishes a pick and never touches the
# generated pages. It records, from a GitHub runner, what each candidate bookmaker,
# esportsbook and odds aggregator actually returns, so "blocked" is an observed
# result rather than a guess.
#
# Triggered by a push that changes the probe script (any branch) or manually.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "tools/probe_sources.py"

permissions:
  contents: write

concurrency:
  group: probe-line-sources-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install --quiet requests

      - name: Probe candidate line sources
        run: python3 tools/probe_sources.py

      - name: Commit receipts
        # The receipt is the evidence, so a receipt that is generated but never committed is a
        # wasted probe (this happened on 2026-10-25 when a branch-bits diag run pushed first).
        # Rebase-and-retry keeps the receipt on the branch whatever else is committing.
        run: |
          git config user.name "arena-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe/sources_probe.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(probe): line-source availability receipts [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "receipt pushed on attempt ${attempt}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "receipt NOT pushed after 5 attempts" >&2
          exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-probe
          path: data/probe/sources_probe.json
          if-no-files-found: warn
