name: data-build
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/collect.py"
      - "tools/model.py"
      - "tools/report.py"
      - "tools/common.py"
      - "data/aliases.json"
      - ".github/workflows/data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline (log captured)
        run: |
          set -o pipefail
          mkdir -p data
          { python3 tools/collect.py; echo "=== MODEL ==="; python3 tools/model.py; echo "=== REPORT ==="; python3 tools/report.py; } > data/build.log 2>&1
      - name: Commit data
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data
          git commit -m "chore(data): build dataset [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
