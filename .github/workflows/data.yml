name: data-build
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline (log captured)
        run: |
          mkdir -p data
          { python3 tools/collect.py && \
            echo "=== MODEL ===" && python3 tools/model.py && \
            echo "=== REPORT ===" && python3 tools/report.py && \
            echo "=== FLAGS ===" && python3 tools/flags.py && \
            echo "=== SITE ===" && python3 tools/site.py && \
            echo "=== VERIFY ===" && python3 tools/verify.py; } > data/build.log 2>&1
      - name: Commit data and site
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): build dataset and site [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
