name: probe-sources-2
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe2.yml"
      - "tools/probe2.sh"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe endpoints
        run: bash tools/probe2.sh
      - name: Commit evidence
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add evidence/probe2
          git commit -m "chore(evidence): probe2 results [skip ci]" || echo "nothing to commit"
          git push
