name: Research — external market ceiling (manual)

# Research-only: enumerates every LoL league on Pinnacle plus the Kalshi and Polymarket
# LoL inventory, to measure how many listed matches any external venue can price.
# Writes research/market_ceiling.json only.

on:
  workflow_dispatch:
  push:
    paths:
      - "research/ceiling-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 research/market_ceiling.py
      - name: Commit evidence
        if: always()
        run: |
          set -e
          test -f research/market_ceiling.json
          git config user.name  "arena-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/market_ceiling.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(research): external market ceiling evidence [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
