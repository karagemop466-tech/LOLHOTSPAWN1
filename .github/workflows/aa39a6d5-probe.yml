name: aa39a6d5-probe

# Session aa39a6d5 (U2): one dated, runner-side retest of the additional low-tier LoL
# line venues named in audit/session_aa39a6d5/probe_lowtier_venues.py, joined against
# the live Hotspawn inventory. Branch-only, read-only against the public web; it writes
# nothing but its own receipts under audit/session_aa39a6d5/. The agent sandbox has no
# outbound HTTPS to these hosts, so the evidence has to be gathered here - exactly the
# network path the six-hourly refresh itself would use.

on:
  workflow_dispatch:
  push:
    branches: ["arena/aa39a6d5-lolhotspawn1"]
    paths:
      - "audit/session_aa39a6d5/probe_lowtier_venues.py"
      - ".github/workflows/aa39a6d5-probe.yml"

permissions:
  contents: write

concurrency:
  group: aa39a6d5-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Probe candidate venues against the live inventory
        run: python3 audit/session_aa39a6d5/probe_lowtier_venues.py 2>&1 | tee audit/session_aa39a6d5/probe.log

      - name: Commit the receipts to the branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f audit/session_aa39a6d5/probe_results.json audit/session_aa39a6d5/probe.log audit/session_aa39a6d5/raw
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "chore(audit): U2 low-tier venue probe receipts [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          echo "could not publish the receipts"; exit 1
