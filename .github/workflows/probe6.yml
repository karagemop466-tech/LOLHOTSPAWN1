name: probe-sources-6
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe6.yml"
      - "tools/probe6.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/probe6.py
      - name: Commit evidence
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add evidence/probe6
          git commit -m "chore(evidence): probe6 leaguepedia coverage [skip ci]" || echo "nothing to commit"
          git push
