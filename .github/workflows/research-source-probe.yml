name: Research — LoL odds source reachability (manual)

# Research-only. Probes 32 candidate LoL betting / esportsbook / odds-API endpoints from
# the runner and commits data/source_probes.json. It never prices a match and never edits
# the published pages. A non-200 probe result is recorded, not worked around.

on:
  workflow_dispatch:
  push:
    paths:
      - "research/probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 research/probe_sources_runner.py
      - name: Commit evidence
        if: always()
        run: |
          set -e
          test -f data/source_probes.json
          git config user.name  "arena-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source_probes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(research): live source probe results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
