name: Deep source research (manual)

# Research-only. Writes research/probe_deep.json and trimmed snapshots under research/raw/.
# It never edits tools/, root pages or data/ used by the published site.

on:
  workflow_dispatch:
  push:
    paths:
      - "research/probe-trigger-deep"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deep probe
        run: python3 research/probe_deep.py
      - name: Commit evidence to this branch
        if: always()
        run: |
          set -e
          test -f research/probe_deep.json
          git config user.name  "arena-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/probe_deep.json research/raw
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(research): deep source probe evidence [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
