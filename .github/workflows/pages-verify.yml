name: Validate Build & Verify Live GitHub Pages

on:
  push:
    branches:
      - main
      - arena/8336fb7e-lolhotspawn1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run full origination, static site build & line-by-line validator
        run: python3 scripts/refresh.py

      - name: Run pytest invariant suite
        run: pytest -v

      - name: Verify live GitHub Pages HTTP 200 across all 9 pages & feeds on main
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import time
          import requests

          base = "https://karagemop466-tech.github.io/LOLHOTSPAWN1"
          targets = [
              "index.html",
              "picks.html",
              "featured.html",
              "originated.html",
              "unresolved.html",
              "tournaments.html",
              "teams.html",
              "methodology.html",
              "flagged.html",
              "assets/styles.css",
              "assets/app.js",
              "data/picks.json",
              "data/picks.csv",
              "data/calibration.json",
              "data/flagged.json",
          ]

          # Wait up to 150s for GitHub Pages CDN propagation of the new root files
          for attempt in range(30):
              r = requests.get(f"{base}/index.html?cb={int(time.time())}", timeout=15)
              if r.status_code == 200 and "Executive Summary" in r.text:
                  break
              time.sleep(5)

          failures = []
          for t in targets:
              resp = requests.get(f"{base}/{t}?cb={int(time.time())}", timeout=20)
              print(f"{resp.status_code}  {base}/{t}  ({len(resp.content)} bytes)")
              if resp.status_code != 200 or len(resp.content) < 50:
                  failures.append((t, resp.status_code))

          if failures:
              raise SystemExit(f"Live GitHub Pages verification failed: {failures}")
          print("ALL 15 LIVE GITHUB PAGES HTML/ASSET/DATA ENDPOINTS VERIFIED HTTP 200!")
          PY
