name: Research — Bovada coupon coverage (manual)

# Research-only: measures whether the unfiltered Bovada coupon carries extra LoL
# moneylines the filtered production feed drops. Writes research/bovada_full.json only.

on:
  workflow_dispatch:
  push:
    paths:
      - "research/bovada-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 research/bovada_full.py
      - name: Commit evidence
        if: always()
        run: |
          set -e
          test -f research/bovada_full.json
          git config user.name  "arena-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/bovada_full.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(research): Bovada coupon coverage evidence [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
