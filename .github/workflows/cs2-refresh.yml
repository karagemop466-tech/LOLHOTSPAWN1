name: cs2-picks

# Counter-Strike 2 pick desk.
#
#  1. pulls every scheduled CS2 fixture from the Hotspawn fixtures API (the same
#     inventory the pick'em lobby renders)
#  2. pulls external lines: Pinnacle guest API (CS2 leagues), Polymarket, Kalshi,
#     Bovada, Kambi/Unibet — Hotspawn's own crowd picks are never an input
#  3. fits a results-based Elo rating from an external results feed and originates a
#     line for every match no book prices
#  4. rebuilds the cs2/ pages, runs the publish gate, commits receipts + data + pages
#
# Serialized with the LoL pipeline through the shared `refresh-picks` concurrency group:
# the two collectors write disjoint files but must not push to the same ref at once.
#
# Publication rule: receipts and diagnostics are always committed (so a failure is
# diagnosable from the repository), while the generated pages are only staged when the
# publish gate passes. A failing gate therefore leaves the last good pages live.

on:
  schedule:
    # Every 4 hours (inside the requested 4-8 h window), off the hour and off the
    # LoL cron minute so the two jobs never start together.
    - cron: "41 */4 * * *"
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "cs2/**"
      - "assets/cs2.*"
      - ".github/workflows/cs2-refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

env:
  # "probe" collects source receipts only; "refresh" runs the full pipeline.
  CS2_MODE: "probe"

jobs:
  cs2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Source availability probe
        run: python3 cs2/probe_sources.py

      - name: Collect, price, publish
        if: env.CS2_MODE != 'probe'
        run: |
          set -uo pipefail
          mkdir -p data/cs2
          : > data/cs2/build.log
          : > data/cs2/failed_steps.txt
          echo "=== cs2 build $(date -u +%FT%TZ) sha=${GITHUB_SHA} ===" | tee -a data/cs2/build.log
          for stage in collect model site verify; do
            echo "--- cs2/${stage}.py ---" | tee -a data/cs2/build.log
            if python3 "cs2/${stage}.py" >> data/cs2/build.log 2>&1; then
              echo "OK   cs2/${stage}.py" | tee -a data/cs2/build.log
            else
              echo "FAIL cs2/${stage}.py" | tee -a data/cs2/build.log
              echo "${stage}" >> data/cs2/failed_steps.txt
            fi
          done
          echo "cs2 pipeline finished at $(date -u +%FT%TZ)" | tee -a data/cs2/build.log

      - name: Gate verdict
        id: gate
        if: env.CS2_MODE != 'probe'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          failed = []
          if os.path.exists("data/cs2/failed_steps.txt"):
              failed = [s.strip() for s in open("data/cs2/failed_steps.txt") if s.strip()]
          ok = True
          if not os.path.exists("data/cs2/verification.json"):
              print("FAIL: no verification.json"); ok = False
          else:
              rep = json.load(open("data/cs2/verification.json"))
              bad = [c for c in rep["checks"] if not c["ok"]]
              print(f"gate: {len(rep['checks']) - len(bad)}/{len(rep['checks'])} checks pass")
              for c in bad:
                  print("FAILED:", c["name"], "::", c.get("detail", ""))
              ok = bool(rep.get("passed")) and not bad
          if failed:
              print("FAILED STAGES:", failed); ok = False
          pathlib.Path("data/cs2/gate_ok").write_text("true" if ok else "false")
          PY
          echo "ok=$(cat data/cs2/gate_ok)" >> "$GITHUB_OUTPUT"

      - name: Commit receipts, data and (only on a passing gate) the pages
        run: |
          set -e
          git config user.name  "arena-cs2-bot"
          git config user.email "actions@users.noreply.github.com"
          test -f data/cs2/gate_ok && grep -q true data/cs2/gate_ok && PAGES=1 || PAGES=0
          git add -f data/cs2
          if [ "$PAGES" = "1" ]; then git add -f cs2/*.html assets/cs2.css assets/cs2.js 2>/dev/null || true; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "chore(cs2): refresh Counter-Strike 2 fixtures, lines and picks"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed"; exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              git reset --soft "origin/${GITHUB_REF_NAME}"
              git add -f data/cs2
              [ "$PAGES" = "1" ] && git add -f cs2/*.html assets/cs2.css assets/cs2.js 2>/dev/null || true
              git commit -q -m "chore(cs2): refresh Counter-Strike 2 fixtures, lines and picks" || true
            fi
            sleep $((attempt * 5))
          done
          echo "could not publish after 5 attempts"; exit 1

      - name: Fail the run when the gate failed
        if: env.CS2_MODE != 'probe'
        run: |
          if grep -q true data/cs2/gate_ok; then echo "gate passed"; else echo "gate failed"; exit 1; fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-picks-${{ github.run_id }}
          path: |
            data/cs2/build.log
            data/cs2/verification.json
            data/cs2/source_probe.json
            data/cs2/collect_report.json
          if-no-files-found: warn
          retention-days: 7
